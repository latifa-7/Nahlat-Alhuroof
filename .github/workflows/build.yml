name: Build app (Android APK + iPhone web app)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy the app into Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/* android/app/src/main/assets/www/
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NahlatAlhuroof.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NahlatAlhuroof-android
          path: NahlatAlhuroof.apk
      - name: Publish download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: نحلة الحروف v1.0.${{ github.run_number }}
          body: |
            **أندرويد:** نزّل ملف NahlatAlhuroof.apk بالأسفل، افتحه، واسمح بالتثبيت من هذا المصدر.
            **آيفون/آيباد:** افتح https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ في Safari ← مشاركة ← إضافة إلى الشاشة الرئيسية.
          files: NahlatAlhuroof.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
